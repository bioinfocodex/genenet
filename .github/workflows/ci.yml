name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The test runner uses node:test with native TypeScript type
          # stripping, so there is no test framework or transpiler to install.
          # Both need Node 22.18 or newer.
          node-version: '22.18'
          cache: npm

      # postinstall runs prisma generate, which needs the schema to be valid.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # --max-warnings is deliberately not set to 0. Fifty-four warnings remain,
      # mostly unused variables, and failing on those would mean either fixing
      # every one now or switching the rules off -- and a rule that is off
      # catches nothing later. Errors block, and there are none: all 52 that
      # existed when this step was added were fixed rather than downgraded.
      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # Building is not the same as working: a Prisma client generated for the
      # wrong platform still compiles, and every affected page quietly falls
      # back to dynamic rendering while the build reports success. So the build
      # runs against a real database rather than on its own.
      - name: Prepare a database for the build
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: file:./ci.db

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: file:./ci.db
          SESSION_SECRET: ci-placeholder-not-a-real-secret

      # The qualification report is the one check that runs against the
      # installation rather than against the code. Here it proves the script
      # itself works end to end; on a real deployment it is the evidence a
      # regulated lab files.
      - name: Installation qualification
        run: npm run qualify
        env:
          DATABASE_URL: file:./ci.db
          SESSION_SECRET: ci-placeholder-not-a-real-secret-but-long-enough

  # PostgreSQL is a supported deployment, which means it has to be run rather
  # than documented. Everything here is the SQLite job's path with one thing
  # changed, which is the point: if the two ever need to differ by more than
  # the provider, this job is where that becomes visible.
  postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: genenet
          POSTGRES_USER: genenet
          POSTGRES_DB: genenet
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://genenet:genenet@localhost:5432/genenet
      SESSION_SECRET: ci-placeholder-not-a-real-secret-but-long-enough

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm

      - run: npm ci

      # The PostgreSQL schema is derived from the SQLite one rather than kept
      # by hand, because two schemas maintained separately do not stay in
      # step -- the second gets edited when somebody remembers.
      - name: The PostgreSQL schema is in step with the SQLite one
        run: npm run schema:postgres:check

      - name: Create the schema on PostgreSQL
        run: npx prisma db push --schema prisma/schema.postgres.prisma

      - name: Generate the client for PostgreSQL
        run: npx prisma generate --schema prisma/schema.postgres.prisma

      # The suite is mostly pure logic and would pass against either engine.
      # It runs here anyway, because the thing being checked is that nothing
      # in the library code reaches for a SQLite-only behaviour at import time.
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Installation qualification
        run: npm run qualify
